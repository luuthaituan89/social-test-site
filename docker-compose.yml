services:
  db:
    image: mysql:8.4
    container_name: socialn-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-socialn}
      MYSQL_USER: ${MYSQL_USER:-socialn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-socialn}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: socialn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: socialn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-socialn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-socialn-development}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set socialn http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb --ignore-existing socialn/socialn-media;
        mc anonymous set download socialn/socialn-media
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-socialn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-socialn-development}

  backend:
    build:
      context: ./backend
    container_name: socialn-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-socialn}:${MYSQL_PASSWORD:-socialn}@db:3306/${MYSQL_DATABASE:-socialn}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-SocialN <no-reply@socialn.local>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/socialn-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialn}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialn-development}
      S3_BUCKET: socialn-media
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@socialn.local}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: ./backend
    container_name: socialn-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-socialn}:${MYSQL_PASSWORD:-socialn}@db:3306/${MYSQL_DATABASE:-socialn}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/socialn-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialn}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialn-development}
      S3_BUCKET: socialn-media
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-SocialN <no-reply@socialn.local>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@socialn.local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    build:
      context: ./backend
    container_name: socialn-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-socialn}:${MYSQL_PASSWORD:-socialn}@db:3306/${MYSQL_DATABASE:-socialn}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/socialn-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialn}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialn-development}
      S3_BUCKET: socialn-media
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: ./frontend
    container_name: socialn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  mysql_data:
  uploads_data:
  redis_data:
  minio_data:
